[project]
name = "hn-tech-digest"
version = "0.1.0"
description = "Hacker News front-page tech digest workflow: emails a summary plus a 1-2 min Voxtral TTS audio briefing on one-shot trigger. Deploys as a managed workflow on Mistral Cloud."
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10",
    "httpx>=0.28",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
